# Límites de peticiones. Va en el contexto http { }, no dentro de server { }.
# En Virtualmin/Debian: copiar a /etc/nginx/conf.d/telegram-limits.conf y recargar (nginx -t && systemctl reload nginx).
# Solo definen las zonas; se aplican con limit_req en deploy/nginx-telegram.conf.

limit_req_zone $binary_remote_addr zone=telegram_login:10m rate=10r/m;   # intentos de acceso
limit_req_zone $binary_remote_addr zone=telegram_upload:10m rate=5r/s;   # subidas de archivos
limit_req_zone $binary_remote_addr zone=telegram_api:10m rate=30r/s;     # resto (miniaturas incluidas: ráfagas altas)
