# Incluir dentro del bloque server { } de djl.com.es (HTTPS), p. ej. en Virtualmin:
# Server Configuration > Edit Directives, o un include en /etc/nginx/snippets/.

location = /telegram { return 301 /telegram/; }

location /telegram/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Subidas grandes y streaming de audio/vídeo sin buffer intermedio
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
